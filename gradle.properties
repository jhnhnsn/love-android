# To set the application display name, only define either `app.name` or `app.name_byte_array`.
# For a rule of thumb:
# * Use `app.name` if your app name doesn't contain any non-ANSI characters.
# * Otherwise, convert your app name to UTF-8 byte array, comma delimited, and put
#   it in `app.name_byte_array`
#app.name=LÖVE for Android
app.name=Flappy Survivor

app.application_id=com.flappysurvivor.game
app.orientation=portrait
app.version_code=2
app.version_name=1.0

# Key signing - set these in local.properties (not tracked by git) or environment variables
# app.signing.key.store=/path/to/your.keystore
# app.signing.key.alias=your_alias
# app.signing.key.store.password=your_password
# app.signing.key.alias.password=your_password


# No need to modify anything past this line!
android.enableJetifier=false
android.useAndroidX=true
android.defaults.buildfeatures.buildconfig=true
android.nonTransitiveRClass=true
android.nonFinalResIds=true
