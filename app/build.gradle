import java.nio.charset.StandardCharsets

apply plugin: 'com.android.application'

// Load signing config from local.properties (not tracked by git)
def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localProperties.load(new FileInputStream(localPropertiesFile))
}

// Helper to get signing property from local.properties, gradle.properties, or environment
def getSigningProperty = { String name ->
    return localProperties.getProperty(name) ?:
           project.properties[name] ?:
           System.getenv(name.replace('.', '_').toUpperCase())
}

android {
    namespace "org.love2d.android.executable"
    ndkVersion '25.2.9519653'

    defaultConfig {
        applicationId project.properties["app.application_id"]
        versionCode project.properties["app.version_code"].toInteger()
        versionName project.properties["app.version_name"]
        minSdk 21
        compileSdk 35
        targetSdk 35
        
        def getAppName = {
            def nameArray = project.properties["app.name_byte_array"]
            def name = project.properties["app.name"]
            if (name != null && nameArray != null) {
                throw new Exception("Only define either `app.name` or `app.name_byte_array` in gradle.properties, but not both!")
            }

            if (name == null) {
                def nameArraySplit = nameArray.split(",")
                def nameBytes = new byte[nameArraySplit.length]
                def count = 0
                for (String s: nameArraySplit) {
                    nameBytes[count++] = (byte) Integer.parseInt(s)
                }
                return new String(nameBytes, StandardCharsets.UTF_8)
            }
            return name
        }

        manifestPlaceholders = [
            NAME:getAppName(),
            ORIENTATION:project.properties["app.orientation"],
        ]
    }
    signingConfigs {
        release {
            def keystorePath = getSigningProperty("app.signing.key.store")
            def storePass = getSigningProperty("app.signing.key.store.password")
            def alias = getSigningProperty("app.signing.key.alias")
            def keyPass = getSigningProperty("app.signing.key.alias.password")
            if (keystorePath && storePass && alias && keyPass) {
                storeFile file(keystorePath)
                storePassword storePass
                keyAlias alias
                keyPassword keyPass
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            def keystorePath = getSigningProperty("app.signing.key.store")
            def storePass = getSigningProperty("app.signing.key.store.password")
            def alias = getSigningProperty("app.signing.key.alias")
            def keyPass = getSigningProperty("app.signing.key.alias.password")
            if (keystorePath && storePass && alias && keyPass) {
                signingConfig signingConfigs.release
            }
        }
    }
    flavorDimensions = ['mode', 'recording']
    productFlavors {
        normal {
            dimension 'mode'
        }
        embed {
            dimension 'mode'
        }
        record {
            dimension 'recording'
        }
        noRecord {
            dimension 'recording'
        }
    }
    lint {
        abortOnError false
    }
}

dependencies {
    api 'androidx.multidex:multidex:2.0.1'
    api fileTree(dir: 'libs', include: ['*.jar'])
    api 'androidx.appcompat:appcompat:1.6.1'
    api project(':love')
}
